<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#7F1D1D"/>
      <stop offset="0.5" stop-color="#B91C1C"/>
      <stop offset="1" stop-color="#991B1B"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0; 0.4 0; -0.4 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F1D1D"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7F1D1D" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7F1D1D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B91C1C" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#B91C1C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" rx="16" fill="#140A0C"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <circle cx="180" cy="40" r="260" fill="url(#glowIndigo)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="300" r="300" fill="url(#glowCyan)">
      <animate attributeName="opacity" values="1;0.6;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- terminal prompt -->
    <text x="82" y="104" font-family="'SF Mono','Fira Code',Menlo,Consolas,monospace" font-size="21" fill="#64748B">~ $ whoami</text>
    <rect x="218" y="86" width="11" height="22" fill="#B91C1C">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- name -->
    <text x="78" y="176" font-family="'SF Mono','Fira Code',Menlo,Consolas,monospace" font-size="64" font-weight="800" letter-spacing="-1" fill="url(#accent)">sur-ser</text>

    <!-- role -->
    <text x="82" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="6" fill="#94A3B8">SENIOR BACKEND ENGINEER</text>

    <!-- detail line -->
    <text x="82" y="262" font-family="'SF Mono','Fira Code',Menlo,Consolas,monospace" font-size="16" fill="#64748B">15+ years · Node.js / NestJS · Redis infrastructure · creator of <tspan fill="#B91C1C">NestJS RedisX</tspan></text>

    <!-- accent underline -->
    <rect x="82" y="284" height="3" rx="1.5" fill="url(#line)" width="260">
      <animate attributeName="width" values="260;360;260" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- L1/L2 cache layers motif -->
    <g transform="translate(950 88)" stroke-width="1.5" fill="none">
      <rect x="34" y="0" width="150" height="44" rx="10" stroke="#B91C1C" stroke-opacity="0.8">
        <animate attributeName="stroke-opacity" values="0.8;0.25;0.8" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="17" y="52" width="150" height="44" rx="10" stroke="#991B1B" stroke-opacity="0.6">
        <animate attributeName="stroke-opacity" values="0.25;0.8;0.25" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="104" width="150" height="44" rx="10" stroke="#7F1D1D" stroke-opacity="0.5">
        <animate attributeName="stroke-opacity" values="0.5;0.15;0.5" dur="3s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <text x="109" y="27" font-family="'SF Mono',Menlo,monospace" font-size="13" fill="#B91C1C" fill-opacity="0.9" text-anchor="middle">L1 · memory</text>
      <text x="92" y="79" font-family="'SF Mono',Menlo,monospace" font-size="13" fill="#991B1B" fill-opacity="0.8" text-anchor="middle">L2 · redis</text>
      <text x="75" y="131" font-family="'SF Mono',Menlo,monospace" font-size="13" fill="#7F1D1D" fill-opacity="0.8" text-anchor="middle">origin · db</text>
    </g>

    <!-- frame border -->
    <rect x="0.5" y="0.5" width="1199" height="319" rx="15.5" stroke="url(#accent)" stroke-opacity="0.35"/>
  </g>
</svg>
