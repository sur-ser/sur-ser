name: Generate metrics

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Personal metrics (header + languages)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: sur-ser
          filename: metrics.svg
          template: terminal
          base: header
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: no
          config_timezone: UTC
          output_action: none

      - name: Contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/contrib-graph.mjs

      - name: Recolor terminal, add graph and commit
        run: |
          file=$(sudo find /metrics_renders -name '*.svg' | head -1)
          sudo mv "$file" assets/metrics.svg
          sudo chown "$(whoami)" assets/metrics.svg
          sed -i 's/#42092b/#0d1117/gi; s/#504b45/#21262d/gi; s/#3c3b37/#161b22/gi; s/#f37458/#3fb950/gi; s/#de4c12/#238636/gi' assets/metrics.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics.svg assets/contrib-graph.svg
          git diff --cached --quiet || git commit -m "chore: update metrics"
          git push
