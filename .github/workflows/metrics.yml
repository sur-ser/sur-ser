name: Generate metrics

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Personal metrics (header + languages)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: sur-ser
          filename: assets/metrics.svg
          template: terminal
          base: header
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: no
          config_timezone: UTC

      - name: NestJS RedisX metrics (org repositories)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nestjs-redisx
          entity: organization
          filename: assets/metrics-redisx.svg
          template: terminal
          base: header, repositories
          config_timezone: UTC
